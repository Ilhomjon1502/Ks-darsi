<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Kompyuter savodxonligi + AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: notebook-paper site; home = curriculum map, lesson = 16:9 slide stage with teacher notes below */
:root{
  --bg:#EEF2F9; --surface:#FFFFFF; --soft:#E3EAFB; --ink:#18213D; --muted:#56627F; --line:#CDD6E8;
  --blue:#2D5BE3; --orange:#EE7F1B; --green:#16936A; --red:#D9413F; --yellow:#F5C33B; --on:#FFFFFF;
  --grid:rgba(45,91,227,.07);
  --f-display:"Fredoka","Nunito",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#171F35; --soft:#1F2A4A; --ink:#E7ECF8; --muted:#9BA7C4; --line:#2C3858;
  --blue:#7D9CFF; --orange:#FFA24D; --green:#3CC98F; --red:#FF7B79; --yellow:#F6D266; --on:#0E1322;
  --grid:rgba(125,156,255,.06); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#171F35; --soft:#1F2A4A; --ink:#E7ECF8; --muted:#9BA7C4; --line:#2C3858;
  --blue:#7D9CFF; --orange:#FFA24D; --green:#3CC98F; --red:#FF7B79; --yellow:#F6D266; --on:#0E1322;
  --grid:rgba(125,156,255,.06); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 64px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
a{color:var(--blue)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.eyebrow{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:var(--muted)}

/* ---------- home ---------- */
.hero{display:grid;gap:14px;padding-block:8px 24px}
.hero h1{font-size:clamp(2rem,5vw,3.4rem)}
.hero h1 span{color:var(--blue)}
.hero p{max-width:62ch;margin:0;color:var(--muted);font-size:1.08rem}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-block:8px 28px}
.pillar{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:8px;min-width:0}
.pillar h3{font-size:1.25rem}
.pillar ul{margin:0;padding-left:1.1em;color:var(--muted)}
.tag{display:inline-block;font-weight:800;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:99px;width:max-content}
.t-hand{background:var(--orange);color:var(--on)}
.t-ai{background:var(--blue);color:var(--on)}
.t-task{background:var(--green);color:var(--on)}
.t-quiz{background:var(--yellow);color:#1b1b1b}
.t-home{background:var(--ink);color:var(--bg)}
.timing{background:var(--surface);border-radius:16px;padding:18px 20px;border:2px solid var(--line);margin-bottom:36px}
.timing h3{font-size:1.1rem;margin-bottom:12px}
.tbar{display:flex;border-radius:10px;overflow:hidden;min-height:58px}
.tbar div{padding:8px 10px;display:flex;flex-direction:column;justify-content:center;min-width:0;color:var(--on);font-size:.85rem;line-height:1.25}
.tbar b{font-family:var(--f-mono);font-size:.95rem}
.module{margin-bottom:34px}
.module-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:14px}
.module-h h2{font-size:1.5rem}
.module-h p{margin:0;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--blue);transform:translateY(-2px)}
.card:focus-visible{outline:3px solid var(--orange)}
.card .num{font-family:var(--f-display);font-size:2.2rem;line-height:1;color:var(--blue)}
.card h3{font-size:1.15rem}
.card p{margin:0;color:var(--muted);font-size:.93rem}
.card .chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:.78rem;background:var(--soft);border-radius:99px;padding:2px 9px;font-weight:700}
.foot{margin-top:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;color:var(--muted);font-size:.93rem}
.foot b{color:var(--ink)}

/* ---------- lesson ---------- */
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin-bottom:14px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--blue)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on)}
.lesson-title{flex:1;min-width:0}
.lesson-title h1{font-size:clamp(1.3rem,3vw,1.9rem)}
.stage{container-type:inline-size;background:var(--surface);border:2px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;aspect-ratio:16/9;position:relative}
.stage:fullscreen{aspect-ratio:auto;width:100vw;height:100vh;border-radius:0;border:0}
.slide{flex:1;min-height:0;overflow:auto;padding:3.4cqw 4.4cqw 2cqw;font-size:max(15px,1.85cqw);display:flex;flex-direction:column;gap:1.4cqw}
.slide h2{font-size:1.75em}
.slide ul,.slide ol{margin:0;padding-left:1.2em;display:grid;gap:.35em}
.slide li::marker{color:var(--blue);font-weight:800}
.slide p{margin:0}
.slide .lead{color:var(--muted)}
.sl-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:3cqw;align-items:center;flex:1;min-height:0}
.sl-grid.full{grid-template-columns:1fr;align-items:start}
.sl-grid > *{min-width:0}
.fig{min-width:0}
.full .fig svg{max-height:30cqw;margin:0 auto}
.fig svg{width:100%;height:auto;display:block;max-height:36cqw}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:2px solid var(--line);background:var(--soft);flex-wrap:wrap}
.bar .count{font-family:var(--f-mono);font-weight:700;font-size:.9rem}
.dots{display:flex;gap:5px;flex:1;flex-wrap:wrap;min-width:0}
.dots button{width:12px;height:12px;border-radius:50%;border:0;padding:0;background:var(--line)}
.dots button.on{background:var(--blue)}
.dots button.q{background:var(--yellow)}
.dots button.q.on{background:var(--blue)}
.ibtn{border:2px solid var(--line);background:var(--surface);border-radius:10px;min-width:42px;height:38px;font-weight:800;font-size:1.05rem}
.ibtn:hover{border-color:var(--blue)}
.note{margin-top:14px;background:var(--surface);border:2px dashed var(--line);border-radius:14px;padding:14px 18px;display:grid;gap:4px}
.note b{font-size:.78rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange)}
.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:18px;flex-wrap:wrap}

/* cover slide */
.cover{justify-content:center;gap:2cqw}
.cover .big{font-family:var(--f-display);font-size:5.4em;line-height:.9;color:var(--blue)}
.cover h2{font-size:2.3em}
.cover .goal{font-size:1.15em;color:var(--muted);max-width:52ch}
.today{display:flex;flex-wrap:wrap;gap:.5em}
.today span{background:var(--soft);border-radius:99px;padding:.25em .8em;font-weight:700;font-size:.9em}

/* building blocks */
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(14em,1fr));gap:.6em}
.key{display:flex;align-items:center;gap:.6em;background:var(--soft);border-radius:.6em;padding:.45em .6em;min-width:0}
.kc{display:inline-flex;align-items:center;gap:.2em;flex-shrink:0}
.kc i{font-style:normal;color:var(--muted);font-weight:800}
kbd{font-family:var(--f-mono);font-size:.82em;font-weight:700;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:.4em;padding:.05em .45em;color:var(--ink);white-space:nowrap}
.flow{display:flex;flex-direction:column;gap:.35em;align-items:stretch}
.full .flow{flex-direction:row}.full .flow .fa{transform:rotate(-90deg)}
@container (max-width: 680px){.full .flow{flex-direction:column}.full .flow .fa{transform:none}}
.fs{flex:1;background:var(--soft);border-radius:.7em;padding:.55em .8em;display:grid;gap:.1em;min-width:0}
.fs b{font-family:var(--f-display);font-weight:600}
.fs span{font-size:.85em;color:var(--muted)}
.fs.c-or{background:var(--orange);color:var(--on)} .fs.c-or span{color:var(--on);opacity:.9}
.fs.c-bl{background:var(--blue);color:var(--on)} .fs.c-bl span{color:var(--on);opacity:.9}
.fs.c-gr{background:var(--green);color:var(--on)} .fs.c-gr span{color:var(--on);opacity:.9}
.fs.c-rd{background:var(--red);color:var(--on)} .fs.c-rd span{color:var(--on);opacity:.9}
.fa{align-self:center;width:1.2em;height:1.2em;flex-shrink:0;display:grid;place-items:center;color:var(--muted)}
.fa::before{content:"";width:.55em;height:.55em;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:translateY(-.15em) rotate(45deg)}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:.8em}
@container (max-width: 520px){.cmp{grid-template-columns:1fr}}
.cmp > div{border-radius:.8em;padding:.7em .9em;border:2px solid var(--line);display:grid;gap:.4em;align-content:start;min-width:0}
.cmp h3{font-size:1.05em}
.cmp .good{border-color:var(--green)} .cmp .good h3{color:var(--green)}
.cmp .bad{border-color:var(--red)} .cmp .bad h3{color:var(--red)}
.cmp .blue{border-color:var(--blue)} .cmp .blue h3{color:var(--blue)}
.cmp .orange{border-color:var(--orange)} .cmp .orange h3{color:var(--orange)}
.cmp ul{font-size:.92em}
.prompt{background:var(--soft);border-left:.3em solid var(--blue);border-radius:.6em;padding:.7em .9em;font-family:var(--f-mono);font-size:.78em;line-height:1.55;display:grid;gap:.3em}
.prompt .pl{font-family:var(--f-body);font-size:.8em;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}
.prompt.ans{border-left-color:var(--green)} .prompt.ans .pl{color:var(--green)}
.prompt.bad{border-left-color:var(--red)} .prompt.bad .pl{color:var(--red)}
.stack{display:grid;gap:.35em}
.stack div{border-radius:.6em;padding:.5em .9em;display:flex;justify-content:space-between;gap:1em;align-items:center;flex-wrap:wrap}
.stack small{opacity:.85}
.rvkf{display:grid;grid-template-columns:repeat(2,1fr);gap:.6em}
@container (max-width: 520px){.rvkf{grid-template-columns:1fr}}
.rvkf div{border-radius:.8em;padding:.6em .8em;display:grid;gap:.2em;color:var(--on)}
.rvkf .L{font-family:var(--f-display);font-size:1.9em;line-height:1}
.rvkf em{font-style:normal;font-size:.88em;opacity:.95}
.tbl{width:100%;border-collapse:collapse;font-size:.9em}
.tbl th,.tbl td{text-align:left;padding:.4em .6em;border-bottom:2px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-display);font-weight:600}
.tbl code{font-family:var(--f-mono);font-size:.9em;font-weight:700;color:var(--blue)}
.tblwrap{overflow-x:auto}
.legend{display:flex;flex-wrap:wrap;gap:.4em .9em;font-size:.85em}
.legend span{display:inline-flex;align-items:center;gap:.35em}
.legend i{width:.9em;height:.9em;border-radius:.2em;display:inline-block}
.phone{max-width:20em;margin:0 auto;background:var(--soft);border:3px solid var(--ink);border-radius:1.6em;padding:1.2em .9em;display:grid;gap:.6em}
.sms{background:var(--surface);border-radius:1em 1em 1em .2em;padding:.7em .9em;font-size:.9em;line-height:1.45}
.flag{background:color-mix(in srgb,var(--red) 22%,transparent);border-bottom:2px solid var(--red);padding:0 .15em;border-radius:.2em}
.flags{display:grid;gap:.3em;font-size:.85em}
.flags span::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:var(--red);margin-right:.45em}
.checks{list-style:none;padding:0 !important}
.checks li{padding-left:1.5em;position:relative}
.checks li::before{content:"";position:absolute;left:0;top:.25em;width:.95em;height:.95em;border:2px solid var(--green);border-radius:.25em}
.warn{background:color-mix(in srgb,var(--orange) 16%,transparent);border-radius:.6em;padding:.5em .8em;font-size:.92em}
.warn b{color:var(--orange)}

/* quiz */
.quiz h2{font-size:1.6em}
.opts{display:grid;gap:.6em;max-width:44em}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:.8em;padding:.6em 1em;text-align:left;font-size:1em;font-weight:700;display:flex;gap:.8em;align-items:center}
.opt:hover{border-color:var(--blue)}
.opt .l{font-family:var(--f-display);width:1.7em;height:1.7em;border-radius:50%;background:var(--soft);display:grid;place-items:center;flex-shrink:0}
.opt.ok{border-color:var(--green);background:color-mix(in srgb,var(--green) 16%,var(--surface))}
.opt.ok .l{background:var(--green);color:var(--on)}
.opt.no{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--surface))}
.opt.no .l{background:var(--red);color:var(--on)}
.why{color:var(--muted)}

/* svg classes */
.st{stroke:var(--ink);stroke-width:2.5;stroke-linejoin:round}
.st1{stroke:var(--ink);stroke-width:1.5;stroke-linejoin:round}
.dash{fill:none;stroke:var(--blue);stroke-width:2;stroke-dasharray:6 5}
.f-surf{fill:var(--surface)} .f-soft{fill:var(--soft)} .f-blue{fill:var(--blue)} .f-or{fill:var(--orange)}
.f-gr{fill:var(--green)} .f-red{fill:var(--red)} .f-yel{fill:var(--yellow)} .f-ink{fill:var(--ink)}
.f-mut{fill:var(--muted)} .f-line{fill:var(--line)} .f-none{fill:none}
.t{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.tm{fill:var(--muted);font-family:var(--f-body);font-weight:600}
.tb{fill:var(--on);font-family:var(--f-display);font-weight:600}
.tinv{fill:var(--bg);font-family:var(--f-body);font-weight:700}
.tmono{fill:var(--ink);font-family:var(--f-mono);font-weight:700}
.ln{stroke:var(--ink);stroke-width:2;fill:none}
.lnm{stroke:var(--muted);stroke-width:1.5;fill:none;stroke-dasharray:4 4}
.arr{stroke:var(--ink);stroke-width:2.5;fill:none}
.lred{stroke:var(--red);stroke-width:2;stroke-dasharray:6 4}

@container (max-width: 680px){
  .sl-grid{grid-template-columns:1fr}
  .slide{padding:20px 18px 14px}
  .cover .big{font-size:3.6em}
}
@media (max-width: 700px){
  .stage{aspect-ratio:auto}
  .slide{min-height:420px}
}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" class="f-ink"/>
    </marker>
  </defs>
</svg>

<div class="wrap" id="app"></div>

<script>
/* ===================== helpers ===================== */
const S=(vb,inner,label)=>`<svg viewBox="${vb}" role="img" aria-label="${label}">${inner}</svg>`;
const T=(x,y,s,o={})=>`<text x="${x}" y="${y}" text-anchor="${o.a||'middle'}" font-size="${o.s||15}" class="${o.c||'t'}">${s}</text>`;
const R=(x,y,w,h,c='f-surf',rx=8,st='st')=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${rx}" class="${c} ${st}"/>`;
const B=(x,y,n)=>`<circle cx="${x}" cy="${y}" r="13" class="f-or"/><text x="${x}" y="${y+5}" text-anchor="middle" font-size="15" class="tb">${n}</text>`;
const L=(x1,y1,x2,y2,c='arr',m=true)=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${c}" ${m?'marker-end="url(#ah)"':''}/>`;

const keys=list=>`<div class="keys">${list.map(([k,d])=>`<div class="key"><span class="kc">${k.split('+').map(x=>`<kbd>${x}</kbd>`).join('<i>+</i>')}</span><span>${d}</span></div>`).join('')}</div>`;
const flow=steps=>`<div class="flow">${steps.map(s=>`<div class="fs ${s.c||''}"><b>${s.t}</b>${s.d?`<span>${s.d}</span>`:''}</div>`).join('<div class="fa" aria-hidden="true"></div>')}</div>`;
const cmp=(a,b)=>`<div class="cmp">${[a,b].map(x=>`<div class="${x.c}"><h3>${x.h}</h3><ul>${x.i.map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>`;
const prompt=(text,label='Prompt',cls='')=>`<div class="prompt ${cls}"><span class="pl">${label}</span>${text}</div>`;
const ul=a=>`<ul>${a.map(i=>`<li>${i}</li>`).join('')}</ul>`;
const ol=a=>`<ol>${a.map(i=>`<li>${i}</li>`).join('')}</ol>`;

/* ===================== diagrams ===================== */
const D={
computer(){
  let k='';for(let r=0;r<3;r++)for(let c=0;c<14;c++)k+=`<rect x="${31+c*17}" y="${242+r*13}" width="13" height="9" rx="2" class="f-surf"/>`;
  return S('0 0 480 310',`
  ${R(20,14,250,168,'f-soft',12)}${R(36,30,218,136,'f-surf',4)}
  ${R(56,50,120,70,'f-soft',4,'st1')}<rect x="56" y="50" width="120" height="14" class="f-blue"/>
  <rect x="190" y="60" width="44" height="8" rx="3" class="f-line"/><rect x="190" y="76" width="34" height="8" rx="3" class="f-line"/>
  <rect x="131" y="182" width="28" height="22" class="f-mut"/>${R(96,202,98,10,'f-mut',4)}
  ${R(300,14,110,200,'f-soft',10)}
  <line x1="318" y1="44" x2="392" y2="44" class="ln"/><line x1="318" y1="60" x2="392" y2="60" class="ln"/>
  <circle cx="355" cy="186" r="10" class="f-gr"/>
  ${R(22,232,248,52,'f-soft',8)}${k}
  <rect x="330" y="236" width="46" height="64" rx="23" class="f-soft st"/><line x1="353" y1="236" x2="353" y2="260" class="ln"/>
  ${B(22,16,1)}${B(410,16,2)}${B(22,234,3)}${B(380,238,4)}`,'Kompyuter qismlari: monitor, tizim bloki, klaviatura, sichqoncha');
},
mouse(){
  return S('0 0 480 280',`
  <rect x="170" y="30" width="140" height="220" rx="70" class="f-surf st"/>
  <path d="M240 30A70 70 0 0 0 170 100L170 120L240 120Z" class="f-blue" opacity=".35"/>
  <path d="M240 30A70 70 0 0 1 310 100L310 120L240 120Z" class="f-or" opacity=".35"/>
  <rect x="170" y="30" width="140" height="220" rx="70" class="f-none st"/>
  <line x1="240" y1="30" x2="240" y2="120" class="ln"/><line x1="170" y1="120" x2="310" y2="120" class="ln"/>
  <rect x="231" y="52" width="18" height="40" rx="9" class="f-ink"/>
  ${T(150,62,'Chap tugma',{a:'end',s:17})}${T(150,84,'1 marta: tanlash',{a:'end',c:'tm',s:14})}${T(150,102,'2 marta: ochish',{a:'end',c:'tm',s:14})}
  ${T(330,62,"O'ng tugma",{a:'start',s:17})}${T(330,84,'menyu ochadi',{a:'start',c:'tm',s:14})}
  <line x1="249" y1="80" x2="326" y2="160" class="lnm"/>
  ${T(330,166,"G'ildirak",{a:'start',s:17})}${T(330,186,'sahifani aylantiradi',{a:'start',c:'tm',s:14})}`,'Sichqoncha tugmalari');
},
desktop(){
  const icons=['Bu kompyuter','Savat','Hujjatlar'].map((n,i)=>`${R(26,18+i*66,34,30,'f-yel',5,'st1')}${T(43,64+i*66,n,{s:11})}`).join('');
  return S('0 0 480 300',`

/* ===================== render ===================== */
const app=document.getElementById('app');
const BADGE={hand:["Qo'lda",'t-hand'],ai:['AI bilan','t-ai'],task:['Amaliyot','t-task'],quiz:['Savol','t-quiz'],home:['Uy vazifasi','t-home']};
const pos={};
let cur=null;

function home(){
  document.title='Kompyuter savodxonligi + AI';
  app.innerHTML=`
  <header class="hero">
    <span class="eyebrow">Codial · O'quv reja · 12 dars</span>
    <h1>Kompyuter savodxonligi <span>+ AI</span></h1>
    <p>Bugun matn, formula va slaydni AI soniyalarda yozib beradi. Lekin faylni saqlash, papkani tartiblash, hujjatni tayyor holga keltirish va AI xatosini topish insonning ishi. Kurs shu ikki ko'nikmani birga o'rgatadi.</p>
  </header>
  <section class="pillars">
    <div class="pillar"><span class="tag t-hand">Qo'lda</span><h3>AI qila olmaydigan ishlar</h3><ul><li>Windows, fayl va papkalar</li><li>Formatlash, saqlash, PDF, chop etish</li><li>Fleshka, arxiv, bulut, zaxira</li><li>Xavfsizlik: parol, 2FA, fishing</li></ul></div>
    <div class="pillar"><span class="tag t-ai">AI bilan</span><h3>AI dan samarali foydalanish</h3><ul><li>R-V-K-F formulasi bilan prompt</li><li>AI javobini tekshirish</li><li>AI qoralamasidan tayyor mahsulot</li><li>AI ga nimani bermaslik</li></ul></div>
  </section>
  <section class="timing">
    <h3>Har bir dars: 90 daqiqa, avval qo'lda, keyin AI bilan</h3>
    <div class="tbar">
      <div style="flex:15;background:var(--ink);color:var(--bg)"><b>15</b>Nazariya</div>
      <div style="flex:40;background:var(--orange)"><b>40</b>Qo'lda amaliyot</div>
      <div style="flex:25;background:var(--blue)"><b>25</b>AI bilan tezlashtirish</div>
      <div style="flex:10;background:var(--green)"><b>10</b>Tekshiruv</div>
    </div>
  </section>
  ${MODULES.map(m=>`<section class="module"><div class="module-h"><span class="eyebrow">Modul ${m.n}</span><h2>${m.t}</h2><p>${m.d}</p></div>
    <div class="cards">${m.l.map(n=>{const L=LESSONS[n-1];return `<button class="card" data-go="${n}"><span class="num">${n}</span><h3>${L.t}</h3><p>${L.goal}</p><span class="chips">${L.tags.map(t=>`<span class="chip">${t}</span>`).join('')}</span></button>`}).join('')}</div></section>`).join('')}
  <footer class="foot">
    <div><b>Kim uchun:</b> 6–9-sinf o'quvchilari va kattalar. Kompyuter bilan deyarli ishlamagan odam ham boshlay oladi.</div>
    <div><b>Bepul vositalar:</b> Windows 10/11, MS Office yoki Google Docs, ChatGPT, Gemini, Copilot, Canva, Gamma.</div>
    <div><b>Yosh chegarasi:</b> ko'p AI xizmatlari 13 yoshdan, ota-ona ruxsati bilan. Kichiklar o'qituvchi akkaunti orqali ishlaydi.</div>
  </footer>`;
  window.scrollTo(0,0);
}

function slideHTML(s,L,n){
  if(s.cover) return `<div class="slide cover"><span class="eyebrow">Modul ${MODULES.find(m=>m.l.includes(n)).n} · 90 daqiqa</span><span class="big">${n}-dars</span><h2>${L.t}</h2><p class="goal">${L.goal}</p><div class="today">${L.today.map(x=>`<span>${x}</span>`).join('')}</div></div>`;
  const [bl,bc]=BADGE[s.b];
  if(s.b==='quiz') return `<div class="slide quiz"><span class="tag ${bc}">${bl}</span><h2>${s.q}</h2><div class="opts">${s.o.map((o,i)=>`<button class="opt" data-i="${i}" data-a="${s.a}"><span class="l">${'ABC'[i]}</span>${o}</button>`).join('')}</div><p class="why" hidden>${s.w}</p></div>`;
  return `<div class="slide"><span class="tag ${bc}">${bl}</span><h2>${s.t}</h2>
    <div class="sl-grid ${s.full||!s.d?'full':''}"><div>${s.x||''}</div>${s.d?`<div class="fig">${s.d}</div>`:''}</div></div>`;
}

function lesson(n){
  const L=LESSONS[n-1];const all=[{cover:1},...L.s];
  if(pos[n]==null)pos[n]=0;const i=Math.min(pos[n],all.length-1);const s=all[i];
  cur={n,len:all.length};
  document.title=`${n}-dars · ${L.t}`;
  const prevL=n>1?`<button class="btn" data-go="${n-1}">← ${n-1}-dars</button>`:'<span></span>';
  const nextL=n<12?`<button class="btn primary" data-go="${n+1}">${n+1}-dars →</button>`:'<span></span>';
  const note=s.n||(s.cover?"Darsni shu slayddan boshlang: bolalarga bugun nimani o'rganishini ko'rsating. Slaydlar orasida ← → tugmalari yoki pult bilan yuring.":'');
  const stageWasFull=document.fullscreenElement&&document.fullscreenElement.id==='stage';
  const html=`
  <div class="topbar"><button class="btn" data-home>← Barcha darslar</button>
    <div class="lesson-title"><span class="eyebrow">${n}-dars</span><h1>${L.t}</h1></div></div>
  <div class="stage" id="stage">${slideHTML(s,L,n)}
    <div class="bar"><button class="ibtn" data-step="-1" aria-label="Oldingi slayd">←</button>
      <div class="dots">${all.map((x,j)=>`<button class="${j===i?'on':''} ${x.b==='quiz'?'q':''}" data-to="${j}" aria-label="${j+1}-slayd"></button>`).join('')}</div>
      <span class="count">${i+1} / ${all.length}</span>
      <button class="ibtn" data-step="1" aria-label="Keyingi slayd">→</button>
      <button class="ibtn" data-fs aria-label="To'liq ekran">⛶</button></div></div>
  ${note?`<div class="note"><b>O'qituvchi uchun</b><span>${note}</span></div>`:''}
  <div class="lesson-nav">${prevL}${nextL}</div>`;
  if(stageWasFull){ // keep fullscreen: replace only the stage content
    const st=document.getElementById('stage');const tmp=document.createElement('div');tmp.innerHTML=html;
    st.innerHTML=tmp.querySelector('#stage').innerHTML;
    const nt=app.querySelector('.note');const nn=tmp.querySelector('.note');
    if(nt&&nn)nt.replaceWith(nn);else if(nt)nt.remove();else if(nn)st.after(nn);
  } else app.innerHTML=html;
}

function route(){
  const m=/^#dars-(\d{1,2})$/.exec(location.hash);
  const n=m?+m[1]:0;
  if(n>=1&&n<=12){lesson(n);} else {cur=null;home();}
}
function go(n){ if(location.hash==='#dars-'+n) route(); else location.hash='dars-'+n; window.scrollTo(0,0);}
function step(d){ if(!cur)return; const nx=Math.max(0,Math.min(cur.len-1,(pos[cur.n]||0)+d)); if(nx!==pos[cur.n]){pos[cur.n]=nx;lesson(cur.n);} }

app.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.go){go(+t.dataset.go);return;}
  if('home' in t.dataset){location.hash='';history.replaceState(null,'',location.pathname+location.search);route();return;}
  if(t.dataset.step){step(+t.dataset.step);return;}
  if(t.dataset.to){pos[cur.n]=+t.dataset.to;lesson(cur.n);return;}
  if('fs' in t.dataset){const st=document.getElementById('stage');
    try{ if(document.fullscreenElement) document.exitFullscreen(); else st.requestFullscreen().catch(()=>{}); }catch(_){}
    return;}
  if(t.classList.contains('opt')){
    const a=+t.dataset.a,i=+t.dataset.i,box=t.parentElement;
    box.querySelectorAll('.opt').forEach(b=>{b.classList.remove('ok','no'); if(+b.dataset.i===a)b.classList.add('ok');});
    if(i!==a)t.classList.add('no');
    box.nextElementSibling.hidden=false;
  }
});
document.addEventListener('keydown',e=>{
  if(!cur||e.target.closest('input,textarea'))return;
  if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();step(1);}
  else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();step(-1);}
});
window.addEventListener('hashchange',route);
route();
</script>
